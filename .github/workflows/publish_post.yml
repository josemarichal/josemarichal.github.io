name: Publish Blog Post from Drafts

on:
  push:
    paths:
      - 'blog_drafts/**'
      - '!blog_drafts/published/**'
      - '!blog_drafts/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pyyaml

      - name: Build Blog Posts from Drafts
        run: |
          python scripts/publish_post.py --all-drafts

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.html posts/ blog_drafts/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-publish blog post from draft [skip ci]"
            git push origin main
          fi
