<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Skills Builder | The 40-30-30 Framework</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-bg: #090e17;
            --sidebar-bg: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.6);
            --border-glow: rgba(16, 185, 129, 0.2);
            --phase1-color: #3b82f6; /* Blue for Prep */
            --phase2-color: #f59e0b; /* Amber for Tech */
            --phase3-color: #ef4444; /* Red for Risk */
        }

        body {
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .app-header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .app-title {
            font-family: var(--font-heading);
            color: var(--text-heading);
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-title span {
            font-size: 0.9rem;
            background: var(--accent-color);
            color: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            letter-spacing: 1px;
        }

        .home-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            transition: all var(--transition-fast);
        }

        .home-link:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* App Layout */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 5;
        }

        .sidebar-header h3 {
            margin: 0;
            color: var(--text-heading);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-btn {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 1.25rem 1.5rem;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.02);
            color: var(--text-heading);
        }

        .nav-btn.active {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--accent-color);
            color: var(--text-heading);
        }

        .nav-num {
            font-family: var(--font-mono);
            color: var(--accent-color);
            font-size: 0.8rem;
            padding-top: 2px;
            min-width: 20px;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 3rem;
            position: relative;
        }

        .main-content::before {
            content: '';
            position: fixed;
            top: 0;
            left: 320px;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .content-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .content-wrapper.fade-out {
            opacity: 0;
        }

        .skill-header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .skill-title {
            font-size: 2.5rem;
            color: var(--text-heading);
            margin: 0 0 1rem 0;
            line-height: 1.2;
        }

        .framework-intro {
            font-size: 1.1rem;
            color: var(--text-main);
            opacity: 0.8;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* The 40-30-30 Grid */
        .framework-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .phase-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .phase-card:hover {
            transform: translateY(-2px);
        }

        .phase-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .phase-1::before { background-color: var(--phase1-color); }
        .phase-2::before { background-color: var(--phase2-color); }
        .phase-3::before { background-color: var(--phase3-color); }

        .phase-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }

        .phase-percent {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .phase-1 .phase-percent { color: var(--phase1-color); }
        .phase-2 .phase-percent { color: var(--phase2-color); }
        .phase-3 .phase-percent { color: var(--phase3-color); }

        .phase-title-group h2 {
            margin: 0 0 0.25rem 0;
            font-size: 1.4rem;
            color: var(--text-heading);
        }

        .phase-title-group p {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-main);
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Phase Content Styling */
        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .checklist li {
            position: relative;
            padding-left: 1.75rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .checklist li::before {
            content: '✓';
            position: absolute;
            left: 0;
            top: 0;
            color: var(--phase1-color);
            font-weight: bold;
        }

        .progression-path {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .skill-tier {
            background: rgba(0,0,0,0.2);
            padding: 1.25rem;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 4px;
        }

        .skill-tier h4 {
            margin: 0 0 0.75rem 0;
            color: var(--phase2-color);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .skill-tier p {
            margin: 0;
            color: var(--text-main);
            line-height: 1.5;
        }

        .risk-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .risk-box {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 4px;
        }

        .risk-box.alert {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        .risk-box h4 {
            margin: 0 0 0.75rem 0;
            color: var(--phase3-color);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .risk-box p {
            margin: 0;
            color: var(--text-main);
            line-height: 1.5;
        }

        .placeholder-message {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-main);
            font-style: italic;
            opacity: 0.6;
        }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 30vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            .main-content { padding: 1.5rem; }
            .risk-grid { grid-template-columns: 1fr; }
            .main-content::before { left: 0; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">DIY Skills Builder <span>40-30-30</span></h1>
        <a href="index.html" class="home-link">← Back to Portfolio</a>
    </header>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Skill Domains</h3>
            </div>
            <ul class="nav-list" id="nav-list">
                <!-- Javascript will populate this -->
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <div class="content-wrapper" id="content-wrapper">
                <!-- Javascript will populate this -->
            </div>
        </main>
    </div>

    <script>
        // The 17 Sections Data Structure
        const skillsData = {
            1: {
                title: "Hand Tools: How to Choose and Use Them",
                intro: "The fundamental building block of all manual labor. Mastering hand tools gives you precision, control, and a tactile understanding of materials.",
                prep40: [
                    "Assess your physical workspace: Ensure proper lighting, ventilation, and a sturdy workbench.",
                    "Safety gear check: Safety glasses and heavy-duty work gloves are non-negotiable.",
                    "Mental readiness: Understand that precision takes patience. Rushing cuts or measurements leads to mistakes and injury.",
                    "Basic toolkit assembly: Acquire a claw hammer, crosscut saw, 25-foot tape measure, multi-bit screwdriver, and slip-joint pliers."
                ],
                tech30: {
                    beginner: "Mastering the tape measure (measure twice, cut once). Basic hammering without bending nails. Operating manual screwdrivers without stripping heads.",
                    intermediate: "Using hand saws (crosscut and rip saws) for straight, plumb cuts. Sharpening and setting saw teeth. Utilizing block planes for edge jointing.",
                    expert: "Complex joining with chisels and gouges. Precision filing. Advanced vise and clamping techniques for flawless glue-ups."
                },
                risk30: {
                    projects: "Building basic shelving, installing door hinges and hardware, crafting simple wooden boxes and framing.",
                    risks: "Moderate physical risk (cuts, blisters, pinched fingers). Low financial risk, as materials for hand-tool projects are typically cheap.",
                    callPro: "When structural integrity of a home's load-bearing walls is involved, or when restoring priceless antique furniture requiring specialized, calibrated tools."
                }
            },
            7: {
                title: "Plumbing: Keeping it in Working Order",
                intro: "Plumbing combines fluid dynamics with mechanical fastening. It is high stakes—water damage is unforgiving—but deeply logical.",
                prep40: [
                    "Locate the main water shutoff valve immediately. Never start work without knowing how to kill the water supply.",
                    "Prepare for a mess: Have buckets, heavy-duty towels, and a wet/dry shop vac on standby.",
                    "Assemble the plumbing toolkit: Pipe wrenches, basin wrenches, Teflon tape, plumber's putty, and pipe cutters.",
                    "Mental readiness: Accept that you will likely get wet and dirty. Panic leads to stripped threads and bigger leaks."
                ],
                tech30: {
                    beginner: "Clearing clogged fixture drains and toilets. Replacing basic faucet aerators and showerheads. Applying Teflon tape to threaded fittings.",
                    intermediate: "Replacing sink P-traps. Swapping out faucet cartridges. Installing new toilet flush valves and wax rings. Working with flexible plastic tubing (PEX).",
                    expert: "Cutting, fluxing, and soldering (sweating) rigid copper pipe. Roughing-in new supply lines. Installing hot-water heaters and sump pumps."
                },
                risk30: {
                    projects: "Fixing leaky faucets, upgrading shower hardware, installing dishwashers, completely resetting a toilet.",
                    risks: "High financial risk if you fail to secure a pressurized supply line (flooding). Moderate physical risk if working with soldering torches.",
                    callPro: "When dealing with main sewer line blockages, frozen/burst pipes inside walls, or tying into the municipal water main."
                }
            },
            8: {
                title: "Electricity: Solving Power Problems Safely",
                intro: "Electrical work is highly abstract and completely invisible. It requires absolute adherence to code and safety protocols.",
                prep40: [
                    "Identify your main breaker panel. Map and label all circuits before touching a single wire.",
                    "The golden rule toolkit: Non-contact voltage tester, wire strippers, linesman pliers, and insulated screwdrivers.",
                    "Safety protocol: Buy a voltage tester and test it on a KNOWN LIVE circuit before trusting it on a dead one.",
                    "Mental readiness: Fear is healthy here. Respect the invisible danger. Never work rushed or distracted."
                ],
                tech30: {
                    beginner: "Understanding fuses vs. breakers. Repairing lamp cords and plugs. Replacing standard wall faceplates safely.",
                    intermediate: "Wiring basic single-pole switches and standard 120V outlets. Installing new light fixtures and ceiling fans on existing boxes.",
                    expert: "Wiring 3-way and 4-way switches. Running new Romex cable through walls. Calculating load for new circuits. Installing heavy outdoor lighting."
                },
                risk30: {
                    projects: "Upgrading all home outlets to GFCI/AFCI, installing smart switches, hanging chandeliers, adding outdoor security lighting.",
                    risks: "Extreme physical risk (electrocution, fire). Significant property risk if wiring is not up to code, potentially voiding home insurance.",
                    callPro: "Upgrading the main service panel, installing sub-panels, running 240V circuits for heavy appliances, or rewiring knob-and-tube."
                }
            }
        };

        // All 17 Sections for the menu
        const sectionNames = [
            "Hand tools", "Power tools", "Fasteners, hardware, and adhesives", "Interior repairs", 
            "Exterior repairs", "Furniture repair", "Plumbing", "Electricity", 
            "Climate control", "Painting and decorating", "Working with wood", "Metals", 
            "Glass, ceramics, plastics", "Brickwork and stonework", "Working with concrete", 
            "Guide to better planning", "Fifty projects you can build"
        ];

        // DOM Elements
        const navList = document.getElementById('nav-list');
        const contentWrapper = document.getElementById('content-wrapper');

        // Initialization
        function initApp() {
            renderSidebar();
            // Load Hand Tools by default
            loadSkill(1);
        }

        // Render Sidebar Navigation
        function renderSidebar() {
            sectionNames.forEach((name, index) => {
                const sectionId = index + 1;
                const li = document.createElement('li');
                li.className = 'nav-item';
                
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id = `nav-${sectionId}`;
                btn.innerHTML = `<span class="nav-num">${sectionId}.</span> <span>${name}</span>`;
                
                btn.addEventListener('click', () => loadSkill(sectionId));
                li.appendChild(btn);
                navList.appendChild(li);
            });
        }

        // Load Skill Content
        function loadSkill(id) {
            // Update Active State
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${id}`).classList.add('active');

            // Fade out, update, fade in
            contentWrapper.classList.add('fade-out');
            
            setTimeout(() => {
                if (skillsData[id]) {
                    renderFramework(skillsData[id]);
                } else {
                    renderPlaceholder(sectionNames[id - 1]);
                }
                contentWrapper.classList.remove('fade-out');
            }, 300);
        }

        // Render the 40-30-30 Framework UI
        function renderFramework(data) {
            let prepListHTML = data.prep40.map(item => `<li>${item}</li>`).join('');

            contentWrapper.innerHTML = `
                <div class="skill-header">
                    <h2 class="skill-title">${data.title}</h2>
                    <p class="framework-intro">${data.intro}</p>
                </div>

                <div class="framework-grid">
                    
                    <!-- 40% Preparation -->
                    <div class="phase-card phase-1">
                        <div class="phase-header">
                            <div class="phase-percent">40%</div>
                            <div class="phase-title-group">
                                <h2>Preparation</h2>
                                <p>Physical Setup & Mental Readiness</p>
                            </div>
                        </div>
                        <ul class="checklist">
                            ${prepListHTML}
                        </ul>
                    </div>

                    <!-- 30% Technical Skill -->
                    <div class="phase-card phase-2">
                        <div class="phase-header">
                            <div class="phase-percent">30%</div>
                            <div class="phase-title-group">
                                <h2>Technical Skill & Experience</h2>
                                <p>Progression Path</p>
                            </div>
                        </div>
                        <div class="progression-path">
                            <div class="skill-tier">
                                <h4>Beginner</h4>
                                <p>${data.tech30.beginner}</p>
                            </div>
                            <div class="skill-tier">
                                <h4>Intermediate</h4>
                                <p>${data.tech30.intermediate}</p>
                            </div>
                            <div class="skill-tier">
                                <h4>Expert</h4>
                                <p>${data.tech30.expert}</p>
                            </div>
                        </div>
                    </div>

                    <!-- 30% Risk Taking -->
                    <div class="phase-card phase-3">
                        <div class="phase-header">
                            <div class="phase-percent">30%</div>
                            <div class="phase-title-group">
                                <h2>Willingness to Take Risks</h2>
                                <p>Execution & Bounds</p>
                            </div>
                        </div>
                        <div class="risk-grid">
                            <div class="risk-box">
                                <h4>Appropriate Projects</h4>
                                <p>${data.risk30.projects}</p>
                            </div>
                            <div class="risk-box">
                                <h4>Inherent Risks</h4>
                                <p>${data.risk30.risks}</p>
                            </div>
                            <div class="risk-box alert" style="grid-column: 1 / -1;">
                                <h4>When to Call a Pro</h4>
                                <p>${data.risk30.callPro}</p>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        // Render Placeholder for unpopulated sections
        function renderPlaceholder(title) {
            contentWrapper.innerHTML = `
                <div class="skill-header">
                    <h2 class="skill-title">${title}</h2>
                    <p class="framework-intro">The 40-30-30 framework mapping for this skill is currently being developed.</p>
                </div>
                <div class="placeholder-message">
                    <h3 style="margin-top: 0;">Module Data Not Yet Available</h3>
                    <p>Select <strong>Hand tools (1)</strong>, <strong>Plumbing (7)</strong>, or <strong>Electricity (8)</strong> to see the framework in action.</p>
                </div>
            `;
        }

        // Start App
        initApp();
    </script>
</body>
</html>
